{% extends 'recommender/tmdb_base.html' %}
{% block title %}Gợi ý phim{% endblock %}
{% block content %}
<section class="recommend-hero">
  <div class="recommend-copy">
    <span class="eyebrow">CINEREC · DÀNH RIÊNG CHO BẠN</span>
    <h1>Tìm phim theo nội dung mô tả</h1>
    <a class="back-link" href="{% url 'recommender:tmdb_browse' %}">← Trở về danh sách phim</a>
  </div>
  <form method="post" class="recommend-card" action="{% url 'recommender:recommend' %}">
    {% csrf_token %}
    <label for="movie_description">Mô tả ngắn gọn về bộ phim bạn muốn</label>
    <textarea id="movie_description" name="movie_description" rows="5" maxlength="500"
      placeholder="Ví dụ: Một phi hành đoàn du hành qua hố sâu không gian để tìm hành tinh mới, trong đó thời gian trôi chậm và nhân vật phải cân bằng nhiệm vụ với gia đình..."
      style="width:100%;resize:vertical;padding:12px;border:1px solid #475569;border-radius:10px;background:rgba(15,23,42,.72);color:#f1f5f9;font:inherit"
      required>{{ movie_description|default:'' }}</textarea>
    <button type="submit">✨ Tìm phim theo mô tả</button>
    {% if error_message %}<p class="error" role="alert">{{ error_message }}</p>{% endif %}
  </form>
</section>
{% endblock %}
