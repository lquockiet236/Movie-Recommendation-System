<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Movie Recommendation{% endblock %}</title>
  <style>
    :root{--background:#0f172a;--surface:#1e293b;--surface-light:#334155;--primary:#6366f1;--secondary:#8b5cf6;--text:#f1f5f9;--muted:#cbd5e1;--border:rgba(148,163,184,.18)}
    *{box-sizing:border-box}
    body{font-family:Inter,system-ui,Arial,sans-serif;background:radial-gradient(circle at top right,rgba(99,102,241,.14),transparent 30rem),var(--background);color:var(--text);margin:0;min-height:100vh;line-height:1.55}
    nav{position:sticky;top:0;z-index:10;background:rgba(30,41,59,.94);padding:12px max(20px,calc((100vw - 1200px)/2));display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--border);backdrop-filter:blur(16px)}
    nav a{color:var(--muted);padding:8px 10px;border-radius:8px;text-decoration:none;font-size:14px;white-space:nowrap}
    nav a:hover{background:rgba(99,102,241,.12);color:#fff}
    nav .nav-brand{display:flex;align-items:center;gap:9px;margin-right:auto;color:var(--text);font-weight:700;font-size:16px}
    .nav-brand-mark{width:32px;height:32px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(135deg,var(--primary),var(--secondary))}
    main{max-width:760px;margin:48px auto;padding:32px;background:linear-gradient(155deg,rgba(30,41,59,.98),rgba(22,33,54,.96));border-radius:20px;border:1px solid var(--border);box-shadow:0 24px 60px rgba(2,6,23,.25)}
    h1,h2{letter-spacing:-.025em}h1{margin:0 0 10px;font-size:clamp(28px,4vw,36px)}
    input,select{width:100%;min-height:46px;padding:11px 13px;border:1px solid #475569;border-radius:10px;margin:7px 0;background:#0f172a;color:#fff;font:inherit}
    input:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(99,102,241,.16)}
    button{min-height:46px;padding:11px 18px;background:linear-gradient(135deg,var(--primary),var(--secondary));border:0;border-radius:10px;color:white;cursor:pointer;font:inherit;font-weight:600;transition:filter .2s,transform .2s}
    button:hover{filter:brightness(1.08);transform:translateY(-1px)}
    li{margin:14px 0}.errorlist{color:#fca5a5;padding-left:20px}a{color:#a5b4fc}
    .signup-card{max-width:540px;padding:38px}
    .signup-header{text-align:center;margin-bottom:26px}
    .signup-mark{display:grid;place-items:center;width:54px;height:54px;margin:0 auto 16px;border-radius:16px;background:linear-gradient(135deg,var(--primary),var(--secondary));font-size:26px;box-shadow:0 12px 30px rgba(99,102,241,.25)}
    .signup-eyebrow{margin:0 0 8px;color:#a5b4fc;font-size:12px;font-weight:700;letter-spacing:.13em}
    .account-form p{margin:0 0 16px}
    .account-form label{display:block;margin-bottom:4px;color:#e2e8f0;font-size:14px;font-weight:600}
    .account-form input{margin:4px 0 0}
    .account-form .helptext{display:block;margin-top:7px;color:#94a3b8;font-size:12px;line-height:1.55}
    .account-form .helptext ul{margin:5px 0 0;padding-left:18px}
    .account-form .errorlist{margin:6px 0 0;padding:0;list-style:none;color:#fca5a5;font-size:13px}
    .account-form button{width:100%;margin-top:4px}
    .signup-footer{margin:22px 0 0;text-align:center;color:var(--muted);font-size:14px}
    .signup-footer a{font-weight:600}
    .signup-home{display:block;margin-top:14px;font-size:13px}
    @media(max-width:760px){nav{padding:10px 12px}nav .nav-brand{margin-right:8px}main{margin:24px 12px;padding:24px}.signup-card{padding:26px 20px}}
  </style>
</head>
<body>
  <nav>
    <a class="nav-brand" href="{% url 'recommender:main' %}"><span class="nav-brand-mark">🎬</span>CineRec</a>
    <a href="{% url 'recommender:tmdb_browse' %}">Khám phá phim</a>
    <a href="{% url 'recommender:recommend' %}">Tìm gợi ý</a>
    <a href="{% url 'recommender:favorites' %}">Yêu thích</a>
    <a href="{% url 'recommender:history' %}">Lịch sử</a>
    <a href="{% url 'recommender:interactions' %}">Tương tác</a>
    {% if user.is_staff %}<a href="{% url 'admin:index' %}">Quản trị</a>{% endif %}
  </nav>
  <main class="{% block main_class %}{% endblock %}">{% block content %}{% endblock %}</main>
</body>
</html>
